<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Audience Research</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Audience Research</a>
  <div class="topbar-right">
    <span id="keyStatus" class="status"></span>
    <button id="themeToggle" class="btn btn-icon" type="button"
      aria-label="Switch between light and dark theme" title="Light / dark">◐</button>
  </div>
</header>

<main>
  <section class="panel" aria-label="New report">
    <div class="tabs" role="tablist">
      <button class="tab is-active" role="tab" aria-selected="true" data-mode="study">Niche study</button>
      <button class="tab" role="tab" aria-selected="false" data-mode="video">Single video</button>
    </div>

    <form id="runForm" autocomplete="off">
      <div id="studyFields">
        <label class="field">
          <span class="label">Channels</span>
          <textarea id="channels" rows="3"
            placeholder="@channel, https://youtube.com/@another, UC…"></textarea>
          <span class="hint">Channel URLs, @handles or channel IDs, separated by commas or new lines.</span>
        </label>
        <label class="field">
          <span class="label">Study name</span>
          <input id="studyName" type="text" maxlength="80" placeholder="Optional, e.g. Home espresso">
        </label>
        <div class="row">
          <label class="field">
            <span class="label">Videos per channel</span>
            <input id="videosPer" type="number" value="8" min="1" max="50">
          </label>
          <label class="field">
            <span class="label">Comments per video</span>
            <input id="commentsPer" type="number" value="300" min="10" max="1000">
          </label>
          <label class="field">
            <span class="label">Comment order</span>
            <select id="sortBy">
              <option value="time">Newest first (less biased)</option>
              <option value="relevance">Top comments</option>
            </select>
          </label>
        </div>
        <p id="quotaEstimate" class="estimate" aria-live="polite"></p>
      </div>

      <div id="videoFields" hidden>
        <div class="row">
          <label class="field field-wide">
            <span class="label">Video URL</span>
            <input id="videoUrl" type="text" placeholder="https://youtube.com/watch?v=…">
          </label>
          <label class="field">
            <span class="label">Comments</span>
            <input id="videoComments" type="number" value="500" min="10" max="5000">
          </label>
        </div>
      </div>

      <div class="actions">
        <button id="runBtn" class="btn btn-primary" type="submit">Run</button>
        <button id="demoBtn" class="btn" type="button">Try the demo</button>
      </div>
    </form>

    <div id="progress" class="progress" hidden aria-live="polite">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <p id="progressLabel" class="progress-label">Starting…</p>
    </div>
    <p id="error" class="error" hidden role="alert"></p>
  </section>

  <article id="report" class="report" hidden></article>
</main>

<div id="tooltip" class="tooltip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
