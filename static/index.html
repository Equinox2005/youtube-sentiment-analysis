<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Audience Research</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <h1>Audience Research</h1>
      <p class="sub">What a niche keeps asking for that nobody has published</p>
    </div>
  </div>
  <div class="topbar-right">
    <span id="keyStatus" class="chip chip-muted">checking…</span>
    <button id="themeToggle" class="btn btn-ghost" type="button" title="Toggle light / dark">◐</button>
  </div>
</header>

<main>
  <section class="panel">
    <div class="tabs" role="tablist">
      <button class="tab is-active" role="tab" aria-selected="true" data-mode="study">Niche study</button>
      <button class="tab" role="tab" aria-selected="false" data-mode="video">Single video</button>
    </div>

    <form id="runForm" autocomplete="off">
      <div id="studyFields">
        <label class="field">
          <span class="label">Channels</span>
          <textarea id="channels" rows="3"
            placeholder="@channel1, @channel2, https://youtube.com/@channel3&#10;…or just type:  demo"></textarea>
          <span class="hint">URLs, @handles or UC… IDs — comma or newline separated.
            Type <code>demo</code> for a pre-computed study that needs no API keys.</span>
        </label>
        <div class="row">
          <label class="field field-sm">
            <span class="label">Videos / channel</span>
            <input id="videosPer" type="number" value="8" min="1" max="50">
          </label>
          <label class="field field-sm">
            <span class="label">Comments / video</span>
            <input id="commentsPer" type="number" value="300" min="10" max="1000">
          </label>
          <label class="field field-sm">
            <span class="label">Sampling</span>
            <select id="sortBy">
              <option value="time">Latest — less biased</option>
              <option value="relevance">Top — engagement-biased</option>
            </select>
          </label>
        </div>
        <p id="quotaEstimate" class="estimate" aria-live="polite"></p>
      </div>

      <div id="videoFields" hidden>
        <label class="field">
          <span class="label">Video URL</span>
          <input id="videoUrl" type="text" placeholder="https://youtube.com/watch?v=…   or   demo">
        </label>
        <div class="row">
          <label class="field field-sm">
            <span class="label">Comments</span>
            <input id="videoComments" type="number" value="500" min="10" max="5000">
          </label>
        </div>
      </div>

      <div class="actions">
        <button id="runBtn" class="btn btn-primary" type="submit">Run</button>
        <button id="demoBtn" class="btn" type="button">Try the demo</button>
      </div>
    </form>

    <div id="progress" class="progress" hidden aria-live="polite">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <p id="progressLabel" class="progress-label">Starting…</p>
    </div>
    <p id="error" class="error" hidden role="alert"></p>
  </section>

  <div id="report" class="report" hidden></div>
</main>

<div id="tooltip" class="tooltip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
